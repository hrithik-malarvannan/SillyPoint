@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Jersey+10&family=Jersey+20&family=Mozilla+Headline:wght@500;600;700;800&display=swap');

:root {
  /* ---- Cinematic night-stadium theme ----
     Dark glass panels over a blurred stadium photo, vivid green primary accent,
     clean sans UI type with an italic serif reserved for the wordmark. */
  --sp-ink: #060B12;
  --sp-pitch: #0B121E;
  --sp-turf: #131C2C;
  --sp-chalk: #F1F5F9;
  --sp-cream: #94A3B8;
  --sp-amber: #22C55E;
  --sp-leather: #F04438;
  --sp-willow: #2DD4BF;
  --sp-line: rgba(255,255,255,0.12);
  --sp-glow: rgba(34,197,94,0.38);
}


html, body {
  margin: 0; padding: 0; min-height: 100%;
  background-color: var(--sp-ink);
}
/* Photo background lives here on body, keyed by data-screen (synced from React state —
   see the useEffect near the top of the component). Plain background-image with the
   default background-attachment:scroll — it moves with the page instead of staying
   fixed in place. Every attempt at a "stays put while scrolling" version
   (background-attachment:fixed, position:fixed, position:sticky, an in-flow negative-
   margin overlap trick, a position:fixed via react-dom portal) broke something else in
   this specific sandboxed iframe, so this trades the pinned effect for something that's
   simply guaranteed to render correctly everywhere, every time. */
body {
  background-image: linear-gradient(rgba(6,11,18,0.74), rgba(6,11,18,0.88)), url(${STADIUM_BG_URI});
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}
body[data-screen="home"], body[data-screen="draft"] {
  background-image: linear-gradient(rgba(6,11,18,0.74), rgba(6,11,18,0.88)), url(${BG_DRAFT_URI});
}
body[data-screen="pretoss"], body[data-screen="strategy"] {
  background-image: linear-gradient(rgba(6,11,18,0.72), rgba(6,11,18,0.86)), url(${BG_TOSS_URI});
}
body[data-screen="match"], body[data-screen="motm"] {
  background-image: linear-gradient(rgba(6,11,18,0.68), rgba(6,11,18,0.85)), url(${BG_MATCH_URI});
}
* { box-sizing: border-box; }

/* ---------------- Landing hero ---------------- */
.sp-landing-hero {
  min-height: 100vh;
  width: 100vw;
  margin-top: -28px;
  margin-bottom: -48px;
  margin-left: calc(-50vw + 50%);
  margin-right: calc(-50vw + 50%);
  padding: 32px 24px;
  background-image: linear-gradient(rgba(6,11,18,0.18), rgba(6,11,18,0.42) 70%, rgba(6,11,18,0.62)), url(${LANDING_BG_URI});
  background-color: #0d1520;
  background-size: cover;
  background-position: center 40%;
  background-repeat: no-repeat;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.sp-landing-title-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 16px;
}
.sp-landing-word {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 6.4rem;
  color: #fdfadc;
  text-shadow: 0 4px 20px rgba(0,0,0,0.7);
  line-height: 1;
  margin: 0;
  letter-spacing: 1px;
}
.sp-landing-subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  color: #ffffff;
  font-size: 1.2rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  margin: 0 0 34px;
  text-align: center;
}
.sp-landing-play-btn {
  background-color: #fdfadc;
  color: #111;
  border: none;
  cursor: pointer;
  padding: 15px 52px;
  border-radius: 40px;
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.5px;
  transition: all 0.25s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.45);
}
.sp-landing-play-btn:hover {
  transform: scale(1.05);
  background-color: #ffffff;
}
@media (max-width: 768px) {
  .sp-landing-word { font-size: 3.6rem; }
  .sp-landing-subtitle { font-size: 0.95rem; margin-bottom: 26px; }
  .sp-landing-hero { padding: 24px 16px; justify-content: center; }
}

.sp-header {
  position: relative; overflow: hidden;
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 16px 20px; border-radius: 14px 14px 0 0;
  font-family: 'Inter', sans-serif; border-bottom: 1px solid var(--sp-line);
  background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  gap: 14px;
}
.sp-header > * { position: relative; z-index: 1; }
.sp-burger-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--sp-line); color: var(--sp-chalk);

}

.sp-header-stamp { display: none; }
.sp-modal-overlay {
  position: fixed; inset: 0; background: rgba(6,11,18,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.sp-modal {
  background: rgba(6,11,18,0.15); border: 1px solid var(--sp-line); border-radius: 18px;
  padding: 20px; max-width: 380px; width: 100%; max-height: 86vh; overflow-y: auto;
  box-shadow: 0 20px 44px rgba(0,0,0,0.45); color: var(--sp-cream);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.sp-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sp-modal-close {
  background: transparent; border: none; color: var(--sp-chalk); font-size: 16px; cursor: pointer;
  opacity: 0.7; width: 28px; height: 28px;
}

.sp-logo { font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 30px; color: var(--sp-chalk); letter-spacing: 0.04em; line-height: 1; }

.sp-panel, .sp-draft, .sp-strategy, .sp-match, .sp-results, .sp-history {
  background:
    radial-gradient(ellipse 65% 40% at 12% -10%, rgba(255,255,255,0.05), transparent 55%),
    radial-gradient(ellipse 65% 40% at 88% -10%, rgba(255,255,255,0.04), transparent 55%),
    radial-gradient(ellipse 70% 35% at 50% 108%, rgba(34,197,94,0.08), transparent 55%),
    rgba(6,11,18,0.15);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--sp-line); border-top: none;

}
/* Live-match screen: slightly less blur so the action-heavy bg stays crisp */
.sp-match {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ---- Site-wide centering ---- */
/* Panels center their text/headings by default (see .sp-panel above). Row/list/table
   structures need left alignment to stay readable, so we opt them back out here. */
.sp-bc-meter-row, .sp-bm-row, .sp-bowler-list, .sp-bowler-row, .sp-captain-list,
.sp-career-table-wrap, .sp-comm-row, .sp-field-leg-item, .sp-flap-row,
.sp-history-item, .sp-history-list, .sp-lineup-list, .sp-lineup-row,
.sp-msb-sub-row, .sp-order-list, .sp-order-meta-row, .sp-order-row, .sp-order-row-warn,
.sp-partner-row, .sp-radio-row, .sp-reroll-row, .sp-sq-player-row, .sp-sq-roster-list,
.sp-strategy-head-row, .sp-ticker-row, .sp-ticker-list, .sp-ticker-compact,
.sp-table, .sp-scorecard, .sp-field, .sp-toggle-row, .sp-custom-filters {
  text-align: left;
}
.sp-table th, .sp-table td { text-align: left; }
.sp-table th:last-child, .sp-table td:last-child,
.sp-table th:nth-child(2), .sp-table td:nth-child(2) { text-align: right; }
/* Buttons and CTAs center as a group even inside a left-aligned row context */
.sp-home-btn-row, .sp-results-actions, .sp-history-btns, .sp-draft-actions, .sp-result-tabs {
  justify-content: center;
}
.sp-toggle-row { justify-content: flex-start; }

.sp-title { font-family: 'Mozilla Headline', sans-serif; font-weight: 700; font-size: 28px; margin: 4px 0 8px; color: var(--sp-chalk); letter-spacing: -0.005em; }
.sp-sub { font-size: 13px; color: var(--sp-cream); opacity: 0.78; margin: 0 0 18px; line-height: 1.5; }
.sp-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sp-amber); display: block; margin-bottom: 6px; }
.sp-player-grid-groups { display: flex; flex-direction: column; gap: 18px; }
.sp-role-group-heading { margin-top: 0; margin-bottom: 8px; }

.sp-field { margin-bottom: 12px; text-align: left; }
.sp-field label { display: block; font-size: 12px; margin-bottom: 4px; opacity: 0.8; font-family: 'Inter', sans-serif; letter-spacing: 0.02em; color: var(--sp-cream); }
.sp-field input, .sp-order-list input {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--sp-line);
  background: rgba(6,11,18,0.15); color: var(--sp-chalk); font-size: 16px; font-family: 'Inter', sans-serif;
}
.sp-field input:focus, .sp-btn:focus-visible { outline: 2px solid var(--sp-amber); outline-offset: 2px; }

.sp-btn {
  font-family: 'Jersey 10', sans-serif; font-size: 16px; padding: 13px 22px; border-radius: 999px;
  border: 1px solid var(--sp-line); background: rgba(6,11,18,0.15); color: var(--sp-chalk); cursor: pointer;
  letter-spacing: 0.02em; font-weight: 400; min-height: 44px;

}
.sp-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.sp-btn-primary { background: var(--sp-amber); color: #06210F; border-color: var(--sp-amber); margin-top: 12px; box-shadow: 0 6px 20px var(--sp-glow); }
.sp-btn-primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 8px 26px var(--sp-glow); }
.sp-btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.24); }
.sp-home-btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.sp-toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 14px; cursor: pointer; min-height: 28px; }
.sp-mode-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.sp-mode-btn {
  flex: 1; min-width: 64px; font-family: 'Inter', sans-serif; font-size: 12px; padding: 11px 10px; border-radius: 10px;
  border: 1px solid var(--sp-line); background: rgba(6,11,18,0.15); color: var(--sp-cream); cursor: pointer; min-height: 40px;
}
.sp-mode-btn.active { background: var(--sp-amber); color: #04141A; border-color: var(--sp-amber); font-weight: 700; }
.sp-ai-thinking { text-align: center; padding: 20px 0; font-style: italic; }
.sp-custom-filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.sp-custom-search { flex: 1; min-width: 160px; padding: 11px; border-radius: 6px; border: 1px solid var(--sp-line); background: rgba(6,11,18,0.15); color: var(--sp-chalk); font-family: 'Inter', sans-serif; font-size: 14px; }
.sp-custom-select { padding: 11px; border-radius: 6px; border: 1px solid var(--sp-line); background: rgba(6,11,18,0.15); color: var(--sp-chalk); font-family: 'Inter', sans-serif; font-size: 14px; }
.sp-custom-select option { background: var(--sp-ink); color: var(--sp-chalk); }
.sp-history-search { width: 100%; margin-bottom: 16px; }

.sp-squads-preview { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--sp-line); }

/* Country buttons */
.sp-sq-countries { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.sp-sq-country-btn {
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  padding: 6px 13px; border-radius: 20px; border: 1px solid var(--sp-line);
  background: rgba(255,255,255,0.05); color: var(--sp-cream); cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.sp-sq-country-btn:hover { background: rgba(34,197,94,0.12); border-color: var(--sp-amber); color: var(--sp-amber); }
.sp-sq-country-btn.active { background: rgba(34,197,94,0.2); border-color: var(--sp-amber); color: var(--sp-amber); font-weight: 700; }

/* Era buttons */
.sp-sq-eras { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sp-sq-era-btn {

}

/* Roster */
.sp-sq-roster { margin-top: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--sp-line); border-radius: 8px; overflow: hidden; }
.sp-sq-roster-head { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--sp-amber); padding: 10px 12px 8px; border-bottom: 1px solid var(--sp-line); }
.sp-sq-roster-list { display: flex; flex-direction: column; }
.sp-sq-player-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }

.sp-sq-player-name { flex: 1; font-size: 13px; color: var(--sp-chalk); }
.sp-sq-role-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.05em; min-width: 28px; text-align: center; }
.sp-sq-role-bat  { background: rgba(34,197,94,0.15); color: var(--sp-amber); }
.sp-sq-role-wk   { background: rgba(240,68,56,0.15);  color: var(--sp-leather); }
.sp-sq-role-ar   { background: rgba(45,212,191,0.2);   color: var(--sp-willow); }
.sp-sq-role-bowl { background: rgba(255,255,255,0.08); color: var(--sp-cream); }
.sp-sq-ratings { display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75; white-space: nowrap; }

.sp-draft-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
.sp-timer-ring { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sp-undo-btn { padding: 7px 12px; font-size: 12px; }
.sp-turn-badge { font-family: 'Jersey 10', sans-serif; font-size: 15px; font-weight: 400; padding: 7px 13px; border-radius: 6px; animation: sp-badge-pop 0.3s ease both; }
.sp-turn-badge.p0 { background: rgba(34,197,94,0.18); color: var(--sp-amber); }
.sp-turn-badge.p1 { background: rgba(166,64,46,0.2); color: #F0A18F; }
@keyframes sp-badge-pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
.sp-progress { font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.7; }

.sp-squad-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.sp-squad-mini { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 10px 6px; opacity: 0.6; border: 1px solid var(--sp-line); transition: opacity 0.2s, border-color 0.2s; }
.sp-squad-mini.active { opacity: 1; border-color: var(--sp-amber); background: rgba(34,197,94,0.06); }
.sp-squad-mini-head { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; color: var(--sp-amber); margin-bottom: 6px; letter-spacing: 0.03em; }
.sp-lineup-list { display: flex; flex-direction: column; gap: 2px; }
.sp-lineup-row { display: flex; align-items: center; gap: 5px; padding: 2px 0; min-height: 18px; }
.sp-lineup-row.filled { }
.sp-lineup-row.empty { opacity: 0.3; }
.sp-lineup-num { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(241,245,249,0.4); width: 12px; flex-shrink: 0; text-align: right; }
.sp-lineup-name { font-family: 'Inter', sans-serif; font-size: 10px; color: var(--sp-chalk); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sp-lineup-empty { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.2); flex: 1; }
.sp-lineup-role { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; }
.sp-sq-role-bat  { background: rgba(34,197,94,0.15); color: var(--sp-amber); }
.sp-sq-role-wk   { background: rgba(240,68,56,0.15);  color: var(--sp-leather); }
.sp-sq-role-ar   { background: rgba(45,212,191,0.2);   color: var(--sp-willow); }
.sp-sq-role-bowl { background: rgba(255,255,255,0.08); color: rgba(241,245,249,0.6); }

.sp-roll-flip { display: flex; justify-content: center; margin: 18px 0; }
.sp-flap-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; perspective: 400px; }
.sp-flap-char {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; background: var(--sp-ink);
  color: var(--sp-amber); min-width: 26px; height: 40px; border-radius: 4px; font-size: 20px;
  border-bottom: 2px solid rgba(6,11,18,0.4); transform-origin: top center; animation: sp-flap-in 0.45s ease both; box-shadow: inset 0 0 12px rgba(34,197,94,0.08);
}
.sp-flap-sm .sp-flap-char { min-width: 18px; height: 28px; font-size: 13px; }
@keyframes sp-flap-in {
  0% { transform: rotateX(100deg); opacity: 0; }
  55% { transform: rotateX(-10deg); }
  100% { transform: rotateX(0deg); opacity: 1; }
}

.sp-reroll-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

.sp-player-grid { display: flex; flex-direction: column; gap: 8px; }
.sp-player-card {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  text-align: left;
  background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  border: 1px solid var(--sp-line); border-radius: 12px;
  padding: 12px 16px; color: var(--sp-cream); cursor: pointer; animation: sp-rise 0.3s ease both;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  width: 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 10px rgba(6,11,18,0.25);
}
.sp-player-card:hover {
  border-color: var(--sp-amber);
  background: linear-gradient(135deg, rgba(34,197,94,0.18), rgba(34,197,94,0.04));
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 20px rgba(6,11,18,0.35), 0 0 0 1px var(--sp-glow);
}
.sp-player-card:active { transform: translateY(0) scale(0.99); }
@keyframes sp-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.sp-pc-info { display: flex; flex-direction: column; min-width: 0; }
.sp-pc-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--sp-chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-pc-role { font-size: 11px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-pc-stats { display: flex; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--sp-willow); flex-shrink: 0; }
.sp-player-picked { opacity: 0.4; cursor: not-allowed; background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.06); box-shadow: none; }

.sp-picked-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 8px; border-radius: 20px; flex-shrink: 0; }
.sp-picked-tag.p0 { background: rgba(34,197,94,0.16); color: var(--sp-amber); }
.sp-picked-tag.p1 { background: rgba(240,68,56,0.16); color: var(--sp-leather); }

.sp-warn { background: rgba(166,64,46,0.2); color: #F0A18F; padding: 9px 13px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
.sp-strategy-head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sp-strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 18px; }

.sp-strategy-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--sp-line); }
.sp-strategy-tab {
  position: relative; flex: 1; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  padding: 10px 8px; background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--sp-cream); cursor: pointer; min-height: 40px;
}
.sp-strategy-tab.active { color: var(--sp-chalk); border-bottom-color: var(--sp-amber); }
.sp-strategy-tab-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f59e0b;
  margin-left: 5px; vertical-align: middle;
}
.sp-strategy-panes { margin-bottom: 18px; }
.sp-strategy-panes .sp-captain-list,
.sp-strategy-panes .sp-order-list,
.sp-strategy-panes .sp-bowler-list { max-height: 420px; }
.sp-radio-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; cursor: pointer; }
.sp-radio-row.selected { color: var(--sp-amber); font-weight: 700; }
.sp-captain-list, .sp-order-list, .sp-bowler-list { max-height: 320px; overflow-y: auto; padding-right: 4px; }

/* Themed scrollbars for every scrollable list/panel — replaces the default
   light-grey browser scrollbar that clashed with the dark glass aesthetic. */
.sp-captain-list, .sp-order-list, .sp-bowler-list,
.sp-commentary-scroll, .sp-ticker-compact, .sp-commentary-feed,
.sp-ticker-list, .sp-modal, .sp-career-table-wrap, .sp-scorecard {
  scrollbar-width: thin;
  scrollbar-color: rgba(34,197,94,0.45) rgba(255,255,255,0.05);
}
.sp-captain-list::-webkit-scrollbar, .sp-order-list::-webkit-scrollbar, .sp-bowler-list::-webkit-scrollbar,
.sp-commentary-scroll::-webkit-scrollbar, .sp-ticker-compact::-webkit-scrollbar, .sp-commentary-feed::-webkit-scrollbar,
.sp-ticker-list::-webkit-scrollbar, .sp-modal::-webkit-scrollbar, .sp-career-table-wrap::-webkit-scrollbar,
.sp-scorecard::-webkit-scrollbar {
  width: 6px; height: 6px;
}
.sp-captain-list::-webkit-scrollbar-track, .sp-order-list::-webkit-scrollbar-track, .sp-bowler-list::-webkit-scrollbar-track,
.sp-commentary-scroll::-webkit-scrollbar-track, .sp-ticker-compact::-webkit-scrollbar-track, .sp-commentary-feed::-webkit-scrollbar-track,
.sp-ticker-list::-webkit-scrollbar-track, .sp-modal::-webkit-scrollbar-track, .sp-career-table-wrap::-webkit-scrollbar-track,
.sp-scorecard::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.04); border-radius: 8px;
}
.sp-captain-list::-webkit-scrollbar-thumb, .sp-order-list::-webkit-scrollbar-thumb, .sp-bowler-list::-webkit-scrollbar-thumb,
.sp-commentary-scroll::-webkit-scrollbar-thumb, .sp-ticker-compact::-webkit-scrollbar-thumb, .sp-commentary-feed::-webkit-scrollbar-thumb,
.sp-ticker-list::-webkit-scrollbar-thumb, .sp-modal::-webkit-scrollbar-thumb, .sp-career-table-wrap::-webkit-scrollbar-thumb,
.sp-scorecard::-webkit-scrollbar-thumb {
  background: rgba(34,197,94,0.45); border-radius: 8px;
}
.sp-captain-list::-webkit-scrollbar-thumb:hover, .sp-order-list::-webkit-scrollbar-thumb:hover, .sp-bowler-list::-webkit-scrollbar-thumb:hover,
.sp-commentary-scroll::-webkit-scrollbar-thumb:hover, .sp-ticker-compact::-webkit-scrollbar-thumb:hover, .sp-commentary-feed::-webkit-scrollbar-thumb:hover,
.sp-ticker-list::-webkit-scrollbar-thumb:hover, .sp-modal::-webkit-scrollbar-thumb:hover, .sp-career-table-wrap::-webkit-scrollbar-thumb:hover,
.sp-scorecard::-webkit-scrollbar-thumb:hover {
  background: rgba(34,197,94,0.7);
}
/* Page-level scrollbar */
html { scrollbar-width: thin; scrollbar-color: rgba(34,197,94,0.4) rgba(6,11,18,0.6); }
html::-webkit-scrollbar { width: 8px; }
html::-webkit-scrollbar-track { background: rgba(6,11,18,0.6); }
html::-webkit-scrollbar-thumb { background: rgba(34,197,94,0.4); border-radius: 8px; }
html::-webkit-scrollbar-thumb:hover { background: rgba(34,197,94,0.65); }

.sp-order-row, .sp-bowler-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--sp-line); }
.sp-bowler-block { border-bottom: 1px solid var(--sp-line); }
.sp-bowler-block .sp-bowler-row { border-bottom: none; padding-bottom: 4px; }
.sp-bowler-controls { display: flex; align-items: center; gap: 6px; }
.sp-pin-toggle { background: rgba(255,255,255,0.06); border: 1px solid var(--sp-line); border-radius: 6px; padding: 3px 7px; font-size: 13px; cursor: pointer; color: rgba(241,245,249,0.5); transition: all 0.15s; }
.sp-pin-toggle.active { background: rgba(34,197,94,0.15); border-color: var(--sp-amber); color: var(--sp-amber); }
.sp-pin-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--sp-amber); background: rgba(34,197,94,0.1); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.sp-pin-grid { padding: 8px 0 10px; }

/* ======== CINEMATIC MATCH SCREEN ======== */
.sp-match-cinematic {
  position: relative; padding: 0 !important; overflow: hidden;
  background: transparent; border: none !important; border-radius: 0 !important;
  min-height: 100vh;
}

/* Stadium background — subtle local decoration behind the match screen only. Just
   fills its own parent (.sp-match-cinematic, which is position:relative + overflow:hidden
   + min-height:100vh) rather than trying to escape to the full viewport — it doesn't need
   to, it's not meant to be visible outside this screen's own section. */
.sp-stadium-bg {
  position: absolute; inset: 0;
  z-index: 0; pointer-events: none; overflow: hidden;
  opacity: 0.15;
  /* Deep night sky base */
  background: #060d04;
}

/* Floodlight glow towers — pure CSS */
.sp-stadium-bg::before {
  content: '';
  position: absolute; inset: 0;
  background:
    /* Left floodlight beam */
    radial-gradient(ellipse 18% 55% at 8% 0%, rgba(255,248,200,0.18) 0%, transparent 70%),
    /* Right floodlight beam */
    radial-gradient(ellipse 18% 55% at 92% 0%, rgba(255,248,200,0.18) 0%, transparent 70%),
    /* Center-left beam */
    radial-gradient(ellipse 12% 40% at 28% 0%, rgba(255,248,200,0.1) 0%, transparent 60%),
    /* Center-right beam */
    radial-gradient(ellipse 12% 40% at 72% 0%, rgba(255,248,200,0.1) 0%, transparent 60%),
    /* Crowd stands — dark ring upper half */
    radial-gradient(ellipse 120% 40% at 50% 0%, rgba(8,16,5,0.97) 0%, transparent 100%),
    /* The pitch outfield glow — bright green oval */
    radial-gradient(ellipse 78% 50% at 50% 62%, rgba(22,90,10,0.92) 0%, rgba(12,45,5,0.6) 55%, transparent 80%),
    /* Deep field fade */
    radial-gradient(ellipse 120% 70% at 50% 100%, rgba(5,20,3,0.98) 0%, transparent 70%),
    /* Overall base gradient sky→pitch */
    linear-gradient(180deg,
      #060d04 0%,
      #08160509 12%,
      #0c240820%,
      #143a0a 38%,
      #1a4e0c 52%,
      #163f09 65%,
      #0c280680%,
      #060e03 100%
    );
}

/* Crowd texture — concentric stand arches suggestion */
.sp-stadium-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    /* Top arc crowd silhouette */
    radial-gradient(ellipse 95% 28% at 50% 2%, rgba(255,255,255,0.025) 0%, transparent 100%),
    /* Floodlight lens flare halos */
    radial-gradient(circle 8% at 8% 2%, rgba(255,250,220,0.12) 0%, transparent 60%),
    radial-gradient(circle 8% at 92% 2%, rgba(255,250,220,0.12) 0%, transparent 60%),
    /* Subtle pitch stripe pattern */
    repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 18px,
      rgba(255,255,255,0.012) 18px,
      rgba(255,255,255,0.012) 36px
    );
  mix-blend-mode: screen;
}

.sp-stadium-overlay {
  position: absolute; inset: 0;
  /* Light vignette over sides and top so UI cards stay readable without hiding the photo */
  background:
    linear-gradient(90deg, rgba(6,11,18,0.3) 0%, transparent 18%, transparent 82%, rgba(6,11,18,0.3) 100%),
    linear-gradient(180deg, rgba(6,11,18,0.4) 0%, transparent 25%, transparent 70%, rgba(6,11,18,0.5) 100%);
}

/* Top bar */
.sp-match-topbar {

  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);

@keyframes sp-live-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.sp-boundary-burst {
  position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%); z-index: 100;
  width: max-content; max-width: 88vw; overflow: hidden; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px;
  border-radius: 16px; backdrop-filter: blur(10px); animation: sp-burst-pop 1.1s ease both;
}
.sp-boundary-burst.four { background: linear-gradient(135deg, rgba(34,197,94,0.22), rgba(45,212,191,0.12)); border: 1px solid var(--sp-amber); }
.sp-boundary-burst.six { background: linear-gradient(135deg, rgba(240,68,56,0.28), rgba(255,150,110,0.14)); border: 1px solid var(--sp-leather); }
.sp-boundary-burst.wicket { background: linear-gradient(135deg, rgba(240,68,56,0.32), rgba(255,255,255,0.2)); border: 1px solid var(--sp-leather); }
.sp-boundary-burst-text {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0.04em;
  color: var(--sp-chalk);
}
.sp-boundary-burst-sub { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--sp-willow); margin-top: 2px; }

/* Score pulse */
.sp-sb-score.sp-pulse { animation: sp-score-pulse 0.26s ease; }
@keyframes sp-score-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); color: var(--sp-amber); } 100% { transform: scale(1); } }

/* Screen-level flash/shake tied to the burst type */
.sp-flash-four { animation: sp-flash-tint-amber 0.5s ease; }
.sp-flash-six { animation: sp-flash-tint-red 0.5s ease; }
.sp-flash-wicket { animation: sp-shake 0.45s ease; }
@keyframes sp-flash-tint-amber { 0% { background-color: rgba(34,197,94,0.12); } 100% { background-color: transparent; } }
@keyframes sp-flash-tint-red { 0% { background-color: rgba(240,68,56,0.14); } 100% { background-color: transparent; } }
@keyframes sp-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}

/* Sparks radiating from a boundary burst */
.sp-sparks { position: absolute; inset: 0; pointer-events: none; }
.sp-spark {
  position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%;
  background: var(--sp-amber); box-shadow: 0 0 6px var(--sp-glow);
  animation: sp-spark-fly 0.9s ease-out both;
  animation-delay: calc(var(--i) * 12ms);
  transform: rotate(calc(var(--i) * 45deg)) translateY(0);
}
@keyframes sp-spark-fly {
  0% { opacity: 1; transform: rotate(calc(var(--i) * 45deg)) translateY(0) scale(1); }
  100% { opacity: 0; transform: rotate(calc(var(--i) * 45deg)) translateY(-70px) scale(0.3); }
}

/* Wicket shatter mark */
.sp-shatter {
  position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
  border: 2px solid var(--sp-leather); border-radius: 50%; opacity: 0.8;
  animation: sp-shatter-ring 0.7s ease-out both;
}
@keyframes sp-shatter-ring { 0% { transform: scale(0.2); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }

.sp-stumps { width: 90px; height: 54px; margin-top: 4px; overflow: visible; }
.sp-stump { fill: var(--sp-chalk); transform-box: fill-box; }
.sp-bail { fill: var(--sp-amber); transform-box: fill-box; }
.sp-stump-l { transform-origin: 50% 100%; animation: sp-stump-fly-l 0.75s ease-in both; }
.sp-stump-m { transform-origin: 50% 100%; animation: sp-stump-fly-m 0.75s ease-in both; }
.sp-stump-r { transform-origin: 50% 100%; animation: sp-stump-fly-r 0.75s ease-in both; }
.sp-bail-l { transform-origin: 50% 50%; animation: sp-bail-fly-l 0.75s ease-in both; }
.sp-bail-r { transform-origin: 50% 50%; animation: sp-bail-fly-r 0.75s ease-in both; }
@keyframes sp-stump-fly-l { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(-22px,8px) rotate(-75deg); opacity: 0.15; } }
@keyframes sp-stump-fly-m { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(3px,-16px) rotate(25deg); opacity: 0.15; } }
@keyframes sp-stump-fly-r { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(24px,8px) rotate(80deg); opacity: 0.15; } }
@keyframes sp-bail-fly-l { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(-34px,-26px) rotate(-140deg); opacity: 0; } }
@keyframes sp-bail-fly-r { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(34px,-24px) rotate(140deg); opacity: 0; } }
.sp-stump-static { fill: var(--sp-chalk); }
.sp-bail-static { fill: var(--sp-amber); }

/* Caught: ball travels into a fielder's glove */
.sp-catch-anim { width: 90px; height: 54px; margin-top: 4px; overflow: visible; }
.sp-catch-glove { fill: rgba(34,197,94,0.22); stroke: var(--sp-amber); stroke-width: 2; }
.sp-catch-ball { fill: var(--sp-chalk); transform-box: fill-box; animation: sp-catch-fly 0.65s ease-in both; }
@keyframes sp-catch-fly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(38px, 32px) scale(0.4); opacity: 0.3; } }

/* LBW: umpire's finger raised behind the struck pad */

.sp-lbw-pad { fill: rgba(241,245,249,0.22); stroke: var(--sp-line); stroke-width: 1.5; }
.sp-lbw-finger { fill: var(--sp-leather); transform-box: fill-box; transform-origin: 50% 100%; animation: sp-lbw-raise 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes sp-lbw-raise { 0% { transform: translateY(20px) scale(0.6); opacity: 0; } 60% { transform: translateY(-4px) scale(1.05); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

/* Ball pills popping into the over ticker */
.sp-ball { animation: sp-ball-pop 0.22s ease both; }
@keyframes sp-ball-pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Newest commentary line sliding in */
.sp-comm-enter { animation: sp-comm-slide-in 0.3s ease both; }
@keyframes sp-comm-slide-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
@keyframes sp-burst-pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  50% { transform: translate(-50%, -50%) scale(1); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
}
